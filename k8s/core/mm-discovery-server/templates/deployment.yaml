apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mm-discovery-server.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "mm-discovery-server.name" . }}
    app.kubernetes.io/part-of: movie-mate
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "mm-discovery-server.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "mm-discovery-server.name" . }}
        app.kubernetes.io/part-of: movie-mate
        app.kubernetes.io/component: backend
        io.kompose.network/movie-mate-network: "true"
    spec:
      containers:
        - name: {{ include "mm-discovery-server.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}

          env:
            {{- toYaml .Values.env | nindent 12 }}
        - name: mm-nginx-proxy
          image: nginx:1.27-alpine
          ports:
            - name: proxy
              containerPort: 8080
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
          readinessProbe:
            httpGet:
              path: /mmate/internal/consul/ui/
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: nginx-conf
          configMap:
            name: mm-discovery-server-nginx

