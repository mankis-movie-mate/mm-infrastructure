apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mm-discovery-server.fullname" . }}-nginx
  labels:
    app.kubernetes.io/name: {{ include "mm-discovery-server.name" . }}
data:
  default.conf: |
    server {
      listen 8080;

      # 🔧 Handle large headers (OAuth2, JWT, etc.)
      large_client_header_buffers 4 32k;
      proxy_buffer_size 32k;
      proxy_buffers 4 64k;
      proxy_busy_buffers_size 64k;

      # 🔍 Log to stdout/stderr for Kubernetes log visibility
      access_log /dev/stdout;
      error_log /dev/stderr info;

      # 🚫 Do NOT rewrite UI path, just proxy as-is
      location /mmate/internal/consul/ui/ {
        proxy_pass http://127.0.0.1:8500;

        # 🔁 Let Consul generate correct redirects under /mmate/internal/consul/ui/
        proxy_redirect / /mmate/internal/consul/ui/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Accept-Encoding "";

        sub_filter_types text/html application/javascript application/json text/css;
        sub_filter_once off;
        sub_filter '"/v1/' '"/mmate/internal/consul/v1/';
      }

      # 🧩 Handle all other prefixed paths
      location /mmate/internal/consul/ {
        rewrite ^/mmate/internal/consul/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8500;
        proxy_redirect / /mmate/internal/consul/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Accept-Encoding "";

        sub_filter_types text/html application/javascript application/json text/css;
        sub_filter_once off;
        sub_filter '"/v1/' '"/mmate/internal/consul/v1/';
      }

      # 📡 Direct un-prefixed API calls (for services)
      location /v1/ {
        proxy_pass http://127.0.0.1:8500;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }
    }
