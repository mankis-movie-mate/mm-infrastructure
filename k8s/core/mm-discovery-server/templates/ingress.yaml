---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: mm-api-gateway-ingress-v1-consul-path-internal
    namespace: {{ .Release.Namespace }}
    annotations:
        # Traefik specific annotations for middleware and entrypoint
        traefik.ingress.kubernetes.io/router.entrypoints: web
        traefik.ingress.kubernetes.io/router.priority: "10"
        traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-mm-consul-redirect-v1@kubernetescrd
spec:
    tls:
        - hosts:
              - {{ .Values.ingress.host | quote }}
    rules:
        - host: {{ .Values.ingress.host | quote }}
          http:
              paths:
                  - path: /v1
                    pathType: Prefix
                    backend:
                        service:
                            name: mm-api-gateway
                            port:
                                number: 8080

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: mm-consul-redirect-v1
  namespace: {{ .Release.Namespace }}
spec:
  replacePathRegex:
    regex: ^/v1/(.*)
    replacement: /mmate/internal/consul/v1/$1
