apiVersion: apps/v1
kind: Deployment
metadata:
  name: mm-traefik-forward-auth
  namespace: movie-mate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mm-traefik-forward-auth
  template:
    metadata:
      labels:
        app: mm-traefik-forward-auth
    spec:
      containers:
        - name: mm-traefik-forward-auth
          image: thomseddon/traefik-forward-auth:latest
          ports:
            - containerPort: 4181
          env:
            - name: DEFAULT_PROVIDER
              value: "oidc"
            - name: PROVIDERS_OIDC_ISSUER_URL
              value: "https://themanki.net/mmate/keycloak/realms/movie-mate"
            - name: PROVIDERS_OIDC_CLIENT_ID
              value: "mm-api-gateway"
            - name: PROVIDERS_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mm-traefik-forward-auth-secret
                  key: client-secret
            - name: SECRET
              valueFrom:
                secretKeyRef:
                  name: mm-traefik-forward-auth-secret
                  key: cookie-secret
            - name: URL_PATH
              value: "/mmate/keycloak"
            - name: AUTH_HOST
              value: "https://themanki.net"
            - name: COOKIE_DOMAIN
              value: ".themanki.net"
            - name: LOG_LEVEL
              value: "debug"

            - name: INSECURE_COOKIE
              value: "true"
