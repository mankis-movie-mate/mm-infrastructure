config:
  clientID: "REPLACE_ME_CLIENT_ID"
  clientSecret: "REPLACE_ME_CLIENT_SECRET"
  cookieSecret: "REPLACE_ME_COOKIE_SECRET"

  annotations: {}

  configFile: |-
    provider = "keycloak-oidc"
    provider_display_name = "Keycloak"
    redirect_url = "https://your-domain.com/your-app/oauth2/callback"
    oidc_issuer_url = "https://your-domain.com/your-app/keycloak/realms/your-realm"
    code_challenge_method = "S256"

    reverse_proxy = true
    pass_authorization_header = true
    set_xauthrequest = true
    skip_provider_button = true
    http_address = "0.0.0.0:4180"
    upstreams = ["static://202"]

    cookie_path = "/"
    cookie_secure = true
    cookie_name = "__Host-oauth2-proxy"
    cookie_samesite = "lax"

    email_domains = ["*"]
    scope = "openid"

extraArgs:
  - --proxy-prefix=/your-app/oauth2
  - --cookie-csrf-per-request=true
  - --cookie-csrf-expire=5m
  - --pass-access-token=true
  - --whitelist-domain=your-domain.com
  - --whitelist-domain=.your-domain.com
  - --standard-logging=true
  - --request-logging=true
  - --auth-logging=true

sessionStorage:
  type: cookie

ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "web"
    traefik.ingress.kubernetes.io/router.priority: "150"
  path: /your-app/oauth2
  pathType: Prefix
  hosts:
    - your-domain.com
  tls:
    - hosts:
        - your-domain.com
