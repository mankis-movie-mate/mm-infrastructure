apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mm-traefik-forward-auth
  namespace: movie-mate
  annotations:
    traefik.ingress.kubernetes.io/router.priority: "100"
spec:
  ingressClassName: traefik
  rules:
    - host: themanki.net
      http:
        paths:
          - path: /mmate/keycloak/_oauth
            pathType: Prefix
            backend:
              service:
                name: mm-traefik-forward-auth
                port:
                  number: 4181
